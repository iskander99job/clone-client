<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101a24">
  <script id="max-bridge" async src="https://st.max.ru/js/max-web-app.js"></script>
  <title>Кратер — фруктовый остров</title>
</head>
<body>
  <main class="arena" aria-label="Фруктовый остров">
    <div class="orchard" aria-hidden="true"></div>
    <div class="clouds" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <span class="cloud-puff"></span><span class="cloud-wisp"></span>
    </div>
    <div id="field"></div>
    <div class="water" aria-hidden="true">
      <div class="water-bubbles"></div>
    </div>
    <section class="hud" aria-label="Интерфейс дуэли">
      <div class="hud-top">
        <div class="fighter fighter-player">
          <span class="avatar avatar-player" aria-hidden="true"></span>
          <div class="fighter-stats">
            <div class="health">
              <progress aria-label="Здоровье игрока" max="100" value="100"></progress>
              <span aria-hidden="true">100 / 100</span>
            </div>
            <div class="nickname">Игрок</div>
          </div>
        </div>
        <div class="fighter fighter-bot">
          <span class="avatar" aria-hidden="true">🍇</span>
          <div class="fighter-stats">
            <div class="health">
              <progress aria-label="Здоровье бота" max="100" value="100"></progress>
              <span aria-hidden="true">100 / 100</span>
            </div>
            <div class="nickname">Бот</div>
          </div>
        </div>
      </div>
      <small class="build-version" id="build-version"></small>
      <div class="hud-bottom">
        <div class="direction-pad" role="group" aria-label="Движение">
          <button class="hud-button up" type="button" aria-label="Прицел выше" aria-disabled="true">↑</button>
          <button class="hud-button left" type="button" aria-label="Влево" aria-disabled="true">←</button>
          <button class="hud-button down" type="button" aria-label="Прицел ниже" aria-disabled="true">↓</button>
          <button class="hud-button right" type="button" aria-label="Вправо" aria-disabled="true">→</button>
        </div>
        <div class="hud-actions" role="group" aria-label="Действия">
          <button class="hud-button shoot" type="button" aria-label="Выстрел" aria-disabled="true"><span class="target-icon" aria-hidden="true"></span></button>
          <button class="hud-button inventory" type="button" aria-label="Инвентарь" aria-haspopup="dialog" aria-expanded="false" aria-controls="weapon-menu" aria-disabled="true">
            <img class="inventory-crate" src="/src/assets/inventory-crate.webp" alt="">
          </button>
          <button class="hud-button jump-forward" type="button" aria-label="Прыжок вперёд" aria-disabled="true"><span class="jump-icon" aria-hidden="true"></span></button>
          <button class="hud-button jump-back" type="button" aria-label="Прыжок назад" aria-disabled="true"><span class="jump-icon jump-icon-back" aria-hidden="true"></span></button>
        </div>
      </div>
      <dialog class="weapon-menu" id="weapon-menu" aria-labelledby="weapon-menu-title">
        <h2 id="weapon-menu-title">Инвентарь</h2>
        <button class="weapon-card" type="button" data-weapon="bazooka" aria-pressed="false" autofocus>
          <span class="bazooka-icon" aria-hidden="true"></span>
          <span>Базука</span>
        </button>
        <div class="weapon-menu-actions">
          <button type="button" data-weapon="none" hidden>Убрать</button>
          <button type="button" data-close-inventory>Закрыть</button>
        </div>
      </dialog>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
