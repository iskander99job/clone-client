<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101a24">
  <title>Кратер — дуэль с ботом</title>
</head>
<body>
  <main class="game">
    <header>
      <div><div class="kicker">ДУЭЛЬ С БОТОМ</div><h1>Кратер</h1></div>
      <button id="restart" type="button">Заново</button>
    </header>
    <div class="score">
      <div class="fighter player"><span>Мята · ты</span><strong id="player-hp">100</strong><progress id="player-bar" max="100" value="100" aria-label="Здоровье Мяты"></progress></div>
      <div class="fighter bot"><span>Искра · бот</span><strong id="bot-hp">100</strong><progress id="bot-bar" max="100" value="100" aria-label="Здоровье Искры"></progress></div>
    </div>
    <section class="arena" aria-label="Поле боя">
      <div id="field"></div>
      <p id="status" role="status">Загрузка…</p>
    </section>
    <div class="controls">
      <label>Угол <output id="angle-value" for="angle">47°</output><input id="angle" type="range" min="12" max="84" value="47" disabled></label>
      <label>Сила <output id="power-value" for="power">49%</output><input id="power" type="range" min="15" max="100" value="49" disabled></label>
      <button id="fire" type="button" disabled>Выстрелить</button>
    </div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
